<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Quiz PWA</title>
  <style>
    :root {
      --primary: #4A90E2;
      --bg: #F4F7F6;
      --card: #FFFFFF;
      --text: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: var(--primary); margin-top: 0; }
    .group { margin-bottom: 1.2rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.4rem; }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #CCC;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:disabled { background: #AAA; }
    #imagePreview {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 0.5rem;
      display: none;
    }
    .quiz-card {
      background: #F9F9F9;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border-left: 4px solid var(--primary);
    }
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: white;
      border: 1px solid #DDD;
      padding: 0.6rem;
      margin: 0.4rem 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .option-btn.correct { background: #D4EDDA; border-color: #28A745; }
    .option-btn.incorrect { background: #F8D7DA; border-color: #DC3545; }
    .explanation { margin-top: 0.5rem; font-size: 0.9rem; color: #555; }
    .status-msg { font-size: 0.85rem; color: #666; font-style: italic; margin-top: 0.2rem; }
    .help-link { font-size: 0.85rem; margin-top: 0.2rem; display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <h1>Photo Quiz AI</h1>

  <!-- Step 1: API Key Configuration -->
  <div class="group">
    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." onchange="loadModels()">
    <div class="help-link">
      Need a key? Generate or copy one from <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a>.
    </div>
    <div id="status" class="status-msg">Enter key to fetch available models.</div>
  </div>

  <!-- Dynamic Model Selection -->
  <div class="group">
    <label for="modelSelect">Select Model:</label>
    <select id="modelSelect" disabled>
      <option value="">-- Load API Key First --</option>
    </select>
  </div>

  <!-- Step 2: Target Audience -->
  <div class="group">
    <label for="ageGroup">Target Age Group:</label>
    <select id="ageGroup">
      <option value="Elementary School">Elementary School</option>
      <option value="Middle School">Middle School</option>
      <option value="High School">High School</option>
    </select>
  </div>

  <!-- Step 3: Photo Input (Camera or Storage Upload) -->
  <div class="group">
    <label>Snap Photo or Upload from Storage:</label>
    
    <!-- Option A: Direct Camera Capture -->
    <div style="margin-bottom: 0.5rem;">
      <label style="font-weight: normal; font-size: 0.9rem;">Take Photo with Camera:</label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processSelectedImage(event)">
    </div>

    <!-- Option B: Upload from Device Storage -->
    <div>
      <label style="font-weight: normal; font-size: 0.9rem;">Upload File from Storage:</label>
      <input type="file" id="storageInput" accept="image/*" onchange="processSelectedImage(event)">
    </div>

    <img id="imagePreview" alt="Preview">
  </div>

  <button class="btn" id="generateBtn" onclick="generateQuiz()">Generate Quiz</button>

  <!-- Step 4: Quiz Section -->
  <div id="quizContainer" style="margin-top: 2rem;"></div>
</div>

<script>
  let currentImageBase64 = null;
  const FALLBACK_MODELS = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-1.5-pro'];

  // Unified handler for image files coming from either camera or storage upload
  function processSelectedImage(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        // Extract base64 payload excluding the data header prefix
        currentImageBase64 = e.target.result.split(',')[1];
      };
      reader.readAsDataURL(file);
    }
  }

  // Dynamically query available models using user's API key
  async function loadModels() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const modelSelect = document.getElementById('modelSelect');
    const status = document.getElementById('status');

    if (!apiKey) return;

    status.innerText = 'Fetching models...';
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const data = await response.json();

      if (data.error) throw new Error(data.error.message);

      modelSelect.innerHTML = '';
      const genModels = data.models.filter(m => m.supportedGenerationMethods?.includes('generateContent'));

      genModels.forEach(m => {
        const modelName = m.name.replace('models/', '');
        const option = document.createElement('option');
        option.value = modelName;
        option.textContent = m.displayName || modelName;
        modelSelect.appendChild(option);
      });

      modelSelect.disabled = false;
      status.innerText = `Loaded ${genModels.length} compatible models.`;
    } catch (err) {
      status.innerText = `Error loading models: ${err.message}. Using default fallback list.`;
      modelSelect.innerHTML = FALLBACK_MODELS.map(m => `<option value="${m}">${m}</option>`).join('');
      modelSelect.disabled = false;
    }
  }

  // Automated model fallback cascade
  async function callGeminiApiWithFallback(selectedModel, payload, apiKey) {
    const modelQueue = Array.from(new Set([selectedModel, ...FALLBACK_MODELS]));

    for (let model of modelQueue) {
      if (!model) continue;
      try {
        document.getElementById('status').innerText = `Attempting generation with model: ${model}...`;
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (response.ok && result.candidates?.[0]?.content?.parts?.[0]?.text) {
          return result.candidates[0].content.parts[0].text;
        }
        console.warn(`Model ${model} failed, trying next fallback...`, result);
      } catch (err) {
        console.warn(`Network/API error on model ${model}:`, err);
      }
    }
    throw new Error('All model attempts failed. Please check your API key or network connection.');
  }

  // Quiz generation logic
  async function generateQuiz() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const selectedModel = document.getElementById('modelSelect').value;
    const ageGroup = document.getElementById('ageGroup').value;
    const btn = document.getElementById('generateBtn');
    const quizContainer = document.getElementById('quizContainer');

    if (!apiKey) return alert('Please enter your Gemini API key.');
    if (!currentImageBase64) return alert('Please snap a photo or upload an image first.');

    btn.disabled = true;
    quizContainer.innerHTML = '<p>Analyzing image and constructing quiz with document grounding...</p>';

    const promptText = `Analyze this image carefully. Generate an interactive 3-question quiz strictly grounded in the visual content of this image, tailored for a ${ageGroup} student level.
    
    Return strictly valid JSON using this format without markdown code fences:
    {
      "quiz": [
        {
          "question": "Question text grounded in the photo?",
          "options": ["Option A", "Option B", "Option C", "Option D"],
          "answerIndex": 0,
          "explanation": "Explanation based on photo context."
        }
      ]
    }`;

    const payload = {
      contents: [{
        parts: [
          { text: promptText },
          { inline_data: { mime_type: "image/jpeg", data: currentImageBase64 } }
        ]
      }],
      generationConfig: {
        response_mime_type: "application/json"
      }
    };

    try {
      const rawText = await callGeminiApiWithFallback(selectedModel, payload, apiKey);
      const cleanJson = rawText.replace(/```json|```/g, '').trim();
      const quizData = JSON.parse(cleanJson);
      
      renderQuiz(quizData.quiz);
      document.getElementById('status').innerText = 'Quiz successfully generated!';
    } catch (err) {
      quizContainer.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
    }
  }

  // Render interactive elements
  function renderQuiz(questions) {
    const quizContainer = document.getElementById('quizContainer');
    quizContainer.innerHTML = '';

    questions.forEach((q, qIndex) => {
      const card = document.createElement('div');
      card.className = 'quiz-card';

      const title = document.createElement('h3');
      title.innerText = `${qIndex + 1}. ${q.question}`;
      card.appendChild(title);

      const optionsDiv = document.createElement('div');

      q.options.forEach((opt, oIndex) => {
        const optBtn = document.createElement('button');
        optBtn.className = 'option-btn';
        optBtn.innerText = opt;
        
        optBtn.onclick = () => {
          const siblingBtns = optionsDiv.querySelectorAll('.option-btn');
          siblingBtns.forEach(b => b.onclick = null);

          if (oIndex === q.answerIndex) {
            optBtn.classList.add('correct');
          } else {
            optBtn.classList.add('incorrect');
            siblingBtns[q.answerIndex].classList.add('correct');
          }

          const exp = document.createElement('p');
          exp.className = 'explanation';
          exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
          card.appendChild(exp);
        };

        optionsDiv.appendChild(optBtn);
      });

      card.appendChild(optionsDiv);
      quizContainer.appendChild(card);
    });
  }
</script>
</body>
</html>
