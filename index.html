<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Quiz PWA</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --primary: #4A90E2;
      --bg: #F4F7F6;
      --card: #FFFFFF;
      --text: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1, h2 { text-align: center; color: var(--primary); margin-top: 0; }
    .group { margin-bottom: 1.2rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.4rem; }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #CCC;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:disabled { background: #AAA; }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 0.8rem;
    }
    .gallery img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #DDD;
    }
    .quiz-card {
      background: #F9F9F9;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      border-left: 4px solid var(--primary);
    }
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: white;
      border: 1px solid #DDD;
      padding: 0.6rem;
      margin: 0.4rem 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .option-btn.correct { background: #D4EDDA; border-color: #28A745; }
    .option-btn.incorrect { background: #F8D7DA; border-color: #DC3545; }
    .explanation { margin-top: 0.5rem; font-size: 0.9rem; color: #555; }
    .status-msg { font-size: 0.85rem; color: #666; font-style: italic; margin-top: 0.2rem; }
    .help-link { font-size: 0.85rem; margin-top: 0.2rem; display: inline-block; }
    .clear-btn {
      background: #E74C3C;
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .history-section {
      margin-top: 2rem;
      border-top: 2px dashed #DDD;
      padding-top: 1rem;
    }
    .history-item {
      background: #FFF;
      border: 1px solid #EEE;
      padding: 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Photo Quiz AI</h1>

  <!-- Step 1: API Configuration -->
  <div class="group">
    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="AIzaSy..." oninput="handleApiKeyInput()">
    <div class="help-link">
      Need a key? Get one from <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a>.
    </div>
    <div id="status" class="status-msg">Enter key to fetch available models.</div>
  </div>

  <!-- Dynamic & Version-Sorted Model Selector -->
  <div class="group">
    <label for="modelSelect">Select Model:</label>
    <select id="modelSelect" disabled>
      <option value="">-- Load API Key First --</option>
    </select>
  </div>

  <!-- Step 2a: Target Age Group -->
  <div class="group">
    <label for="ageGroup">Target Age Group:</label>
    <select id="ageGroup">
      <option value="Elementary School">Elementary School</option>
      <option value="Middle School">Middle School</option>
      <option value="High School">High School</option>
    </select>
  </div>

  <!-- Step 2b: Question Count Selector -->
  <div class="group">
    <label for="questionCount">Number of Questions:</label>
    <select id="questionCount">
      <option value="3">3 Questions</option>
      <option value="5" selected>5 Questions</option>
      <option value="10">10 Questions</option>
      <option value="15">15 Questions</option>
    </select>
  </div>

  <!-- Step 3: Multi-Image Inputs -->
  <div class="group">
    <label>Snap Photo(s) or Upload File(s):</label>
    
    <div style="margin-bottom: 0.5rem;">
      <label style="font-weight: normal; font-size: 0.9rem;">Snap with Camera:</label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple onchange="processSelectedImages(event)">
    </div>

    <div>
      <label style="font-weight: normal; font-size: 0.9rem;">Upload from Storage:</label>
      <input type="file" id="storageInput" accept="image/*" multiple onchange="processSelectedImages(event)">
    </div>

    <div id="gallery" class="gallery"></div>
    <button id="clearImagesBtn" class="clear-btn" style="display:none;" onclick="clearImages()">Clear Selected Images</button>
  </div>

  <button class="btn" id="generateBtn" onclick="generateQuiz()">Generate Quiz</button>

  <!-- Step 4: Interactive Quiz Output -->
  <div id="quizContainer" style="margin-top: 2rem;"></div>

  <!-- Step 5: Score History Section -->
  <div class="history-section">
    <h2>Score History</h2>
    <div id="historyList"></div>
    <button id="clearHistoryBtn" class="clear-btn" style="display:none;" onclick="clearScoreHistory()">Clear History</button>
  </div>
</div>

<script>
  // Register Service Worker using relative path for GitHub Pages subpath compatibility
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
  }

  let currentImages = [];
  let totalQuestionsCount = 0;
  let answeredQuestionsCount = 0;
  let currentCorrectScore = 0;

  const FALLBACK_MODELS = ['gemini-2.5-flash', 'gemini-2.5-pro', 'gemini-2.0-flash', 'gemini-1.5-flash'];

  // Initialization on DOM Load: Restore API Key, Uploaded Images, and Score History
  document.addEventListener('DOMContentLoaded', () => {
    restoreSavedApiKey();
    restoreSavedImages();
    displayScoreHistory();
  });

  /* ========================================================
     RESTORE & SAVE STATE (API KEY & IMAGES)
     ======================================================== */

  function handleApiKeyInput() {
    const key = document.getElementById('apiKey').value.trim();
    if (key) {
      localStorage.setItem('gemini_api_key', key);
      loadModels();
    } else {
      localStorage.removeItem('gemini_api_key');
    }
  }

  function restoreSavedApiKey() {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      document.getElementById('apiKey').value = savedKey;
      loadModels();
    }
  }

  function saveImagesToStorage() {
    try {
      localStorage.setItem('photo_quiz_temp_images', JSON.stringify(currentImages));
    } catch (e) {
      console.warn('Storage limit reached, could not save all images to cache:', e);
    }
  }

  function restoreSavedImages() {
    const savedImages = localStorage.getItem('photo_quiz_temp_images');
    if (savedImages) {
      try {
        currentImages = JSON.parse(savedImages);
        updateGalleryUI();
      } catch (e) {
        console.error('Failed to parse cached images:', e);
      }
    }
  }

  /* ========================================================
     IMAGE PROCESSING & GALLERY
     ======================================================== */

  function processSelectedImages(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;

    let processedCount = 0;

    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const fullBase64 = e.target.result;
        const mimeType = file.type || 'image/jpeg';
        const base64Data = fullBase64.split(',')[1];

        currentImages.push({ mimeType, base64: base64Data, previewUrl: fullBase64 });
        processedCount++;

        if (processedCount === files.length) {
          updateGalleryUI();
          saveImagesToStorage();
        }
      };
      reader.readAsDataURL(file);
    });

    event.target.value = '';
  }

  function updateGalleryUI() {
    const gallery = document.getElementById('gallery');
    const clearBtn = document.getElementById('clearImagesBtn');
    gallery.innerHTML = '';

    currentImages.forEach(imgObj => {
      const img = document.createElement('img');
      img.src = imgObj.previewUrl;
      gallery.appendChild(img);
    });

    clearBtn.style.display = currentImages.length > 0 ? 'inline-block' : 'none';
  }

  function clearImages() {
    currentImages = [];
    localStorage.removeItem('photo_quiz_temp_images');
    updateGalleryUI();
  }

  /* ========================================================
     MODEL FETCHING & API CALLS
     ======================================================== */

  async function loadModels() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const modelSelect = document.getElementById('modelSelect');
    const status = document.getElementById('status');

    if (!apiKey) return;

    status.innerText = 'Fetching and sorting models...';
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const data = await response.json();

      if (data.error) throw new Error(data.error.message);

      modelSelect.innerHTML = '';

      let genModels = data.models.filter(m => 
        m.supportedGenerationMethods?.includes('generateContent') &&
        !m.name.includes('embedding') &&
        !m.name.includes('aqa')
      );

      // Sort models numerically by extracted version number (descending)
      genModels.sort((a, b) => {
        const nameA = a.name.toLowerCase();
        const nameB = b.name.toLowerCase();

        const matchA = nameA.match(/gemini-(\d+\.?\d*)/);
        const matchB = nameB.match(/gemini-(\d+\.?\d*)/);

        const vA = matchA ? parseFloat(matchA[1]) : 0;
        const vB = matchB ? parseFloat(matchB[1]) : 0;

        if (vB !== vA) return vB - vA;
        return nameA.localeCompare(nameB);
      });

      genModels.forEach(m => {
        const modelName = m.name.replace('models/', '');
        const option = document.createElement('option');
        option.value = modelName;
        option.textContent = `${m.displayName || modelName} (${modelName})`;
        modelSelect.appendChild(option);
      });

      modelSelect.disabled = false;
      status.innerText = `Loaded ${genModels.length} models (Sorted latest first).`;
    } catch (err) {
      status.innerText = `Error loading models: ${err.message}. Using default fallbacks.`;
      modelSelect.innerHTML = FALLBACK_MODELS.map(m => `<option value="${m}">${m}</option>`).join('');
      modelSelect.disabled = false;
    }
  }

  async function callGeminiApiWithFallback(selectedModel, payload, apiKey) {
    const modelQueue = Array.from(new Set([selectedModel, ...FALLBACK_MODELS]));

    for (let model of modelQueue) {
      if (!model) continue;
      try {
        document.getElementById('status').innerText = `Attempting generation with model: ${model}...`;
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (response.ok && result.candidates?.[0]?.content?.parts?.[0]?.text) {
          return result.candidates[0].content.parts[0].text;
        }
        console.warn(`Model ${model} failed, attempting fallback...`, result);
      } catch (err) {
        console.warn(`Network error on model ${model}:`, err);
      }
    }
    throw new Error('All model attempts failed. Check your API key or network connection.');
  }

  /* ========================================================
     QUIZ GENERATION & CONFIRMATION GUARD
     ======================================================== */

  async function generateQuiz() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const selectedModel = document.getElementById('modelSelect').value;
    const ageGroup = document.getElementById('ageGroup').value;
    const questionCount = document.getElementById('questionCount').value;
    const btn = document.getElementById('generateBtn');
    const quizContainer = document.getElementById('quizContainer');

    // BUG FIX 2: Guard against accidental re-generation if a quiz is currently visible
    const existingCards = quizContainer.querySelectorAll('.quiz-card');
    if (existingCards.length > 0) {
      const confirmNew = confirm("Do you need new set of Questions?");
      if (!confirmNew) {
        return; // User canceled the action
      }
    }

    if (!apiKey) return alert('Please enter your Gemini API key.');
    if (currentImages.length === 0) return alert('Please snap or upload at least one photo.');

    btn.disabled = true;
    quizContainer.innerHTML = `<p>Analyzing ${currentImages.length} image(s) and building a ${questionCount}-question quiz...</p>`;

    const promptText = `Carefully examine all provided images. Generate an interactive ${questionCount}-question quiz grounded directly in the provided material, tailored for a ${ageGroup} student level.

    CRITICAL RULES:
    1. Do NOT include any references to page numbers, slide numbers, or section names in the questions or explanations (e.g., write "What is...", NEVER "From page 3, what is...").
    2. Ground every question strictly on facts present across the provided images.

    Return strictly valid JSON using this format without markdown code fences:
    {
      "quiz": [
        {
          "question": "Question text grounded in the material?",
          "options": ["Option A", "Option B", "Option C", "Option D"],
          "answerIndex": 0,
          "explanation": "Clear explanation based on context."
        }
      ]
    }`;

    const parts = [{ text: promptText }];
    currentImages.forEach(img => {
      parts.push({
        inline_data: { mime_type: img.mimeType, data: img.base64 }
      });
    });

    const payload = {
      contents: [{ parts }],
      generationConfig: {
        response_mime_type: "application/json"
      }
    };

    try {
      const rawText = await callGeminiApiWithFallback(selectedModel, payload, apiKey);
      const cleanJson = rawText.replace(/```json|```/g, '').trim();
      const quizData = JSON.parse(cleanJson);
      
      renderQuiz(quizData.quiz, ageGroup);
      document.getElementById('status').innerText = 'Quiz successfully generated!';
    } catch (err) {
      quizContainer.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
    }
  }

  function renderQuiz(questions, ageGroup) {
    const quizContainer = document.getElementById('quizContainer');
    quizContainer.innerHTML = '';

    totalQuestionsCount = questions.length;
    answeredQuestionsCount = 0;
    currentCorrectScore = 0;

    questions.forEach((q, qIndex) => {
      const card = document.createElement('div');
      card.className = 'quiz-card';

      const title = document.createElement('h3');
      title.innerText = `${qIndex + 1}. ${q.question}`;
      card.appendChild(title);

      const optionsDiv = document.createElement('div');

      q.options.forEach((opt, oIndex) => {
        const optBtn = document.createElement('button');
        optBtn.className = 'option-btn';
        optBtn.innerText = opt;
        
        optBtn.onclick = () => {
          const siblingBtns = optionsDiv.querySelectorAll('.option-btn');
          siblingBtns.forEach(b => b.onclick = null);

          answeredQuestionsCount++;

          if (oIndex === q.answerIndex) {
            optBtn.classList.add('correct');
            currentCorrectScore++;
          } else {
            optBtn.classList.add('incorrect');
            siblingBtns[q.answerIndex].classList.add('correct');
          }

          const exp = document.createElement('p');
          exp.className = 'explanation';
          exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
          card.appendChild(exp);

          if (answeredQuestionsCount === totalQuestionsCount) {
            saveScore(ageGroup, currentCorrectScore, totalQuestionsCount);
          }
        };

        optionsDiv.appendChild(optBtn);
      });

      card.appendChild(optionsDiv);
      quizContainer.appendChild(card);
    });
  }

  /* ========================================================
     LOCALSTORAGE SCORE HISTORY
     ======================================================== */

  function saveScore(ageGroup, score, total) {
    const history = JSON.parse(localStorage.getItem('photo_quiz_scores') || '[]');
    const record = {
      date: new Date().toLocaleString(),
      ageGroup,
      score: `${score}/${total}`,
      percentage: Math.round((score / total) * 100) + '%'
    };

    history.unshift(record);
    localStorage.setItem('photo_quiz_scores', JSON.stringify(history));
    displayScoreHistory();
  }

  function displayScoreHistory() {
    const historyList = document.getElementById('historyList');
    const clearBtn = document.getElementById('clearHistoryBtn');
    const history = JSON.parse(localStorage.getItem('photo_quiz_scores') || '[]');

    if (history.length === 0) {
      historyList.innerHTML = '<p class="status-msg">No quiz history recorded yet.</p>';
      clearBtn.style.display = 'none';
      return;
    }

    historyList.innerHTML = history.map(item => `
      <div class="history-item">
        <div>
          <strong>${item.ageGroup}</strong><br>
          <small style="color:#777;">${item.date}</small>
        </div>
        <div style="font-weight: bold; color: var(--primary);">
          ${item.score} (${item.percentage})
        </div>
      </div>
    `).join('');

    clearBtn.style.display = 'inline-block';
  }

  function clearScoreHistory() {
    localStorage.removeItem('photo_quiz_scores');
    displayScoreHistory();
  }
</script>
</body>
</html>
