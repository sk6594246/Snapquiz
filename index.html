<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A1F2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photo Quiz">
  <title>Photo Quiz</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* ===== TOKENS ===== */
    :root {
      --ink: #0F1419;
      --ink-muted: #5A6A7A;
      --ink-subtle: #8B9BAE;
      --paper: #F8FAFC;
      --paper-elevated: #FFFFFF;
      --accent: #2563EB;
      --accent-strong: #1D4ED8;
      --accent-soft: #DBEAFE;
      --success: #059669;
      --success-soft: #D1FAE5;
      --danger: #DC2626;
      --danger-soft: #FEE2E2;
      --warning: #D97706;
      --warning-soft: #FEF3C7;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --shadow-sm: 0 1px 2px rgba(15,20,25,0.06);
      --shadow-md: 0 4px 12px rgba(15,20,25,0.08);
      --shadow-lg: 0 12px 32px rgba(15,20,25,0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 999px;
      --header-h: 56px;
      --tab-h: 72px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
      --safe-right: env(safe-area-inset-right);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", "Fira Code", monospace;
      --scale-xs: 0.75rem;
      --scale-sm: 0.875rem;
      --scale-base: 1rem;
      --scale-lg: 1.125rem;
      --scale-xl: 1.25rem;
      --scale-2xl: 1.5rem;
      --scale-3xl: 2rem;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #F1F5F9;
        --ink-muted: #94A3B8;
        --ink-subtle: #64748B;
        --paper: #0F172A;
        --paper-elevated: #1E293B;
        --accent: #3B82F6;
        --accent-strong: #60A5FA;
        --accent-soft: #1E3A5F;
        --success: #10B981;
        --success-soft: #064E3B;
        --danger: #EF4444;
        --danger-soft: #7F1D1D;
        --warning: #F59E0B;
        --warning-soft: #78350F;
        --border: #334155;
        --border-strong: #475569;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
        --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
      }
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      font-size: var(--scale-base);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== LAYOUT SHELL ===== */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 100%;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: calc(var(--header-h) + var(--safe-top));
      padding-top: var(--safe-top);
      background: rgba(248,250,252,0.9);
      backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: var(--space-4);
    }

    @media (prefers-color-scheme: dark) {
      .app-header { background: rgba(15,23,42,0.9); }
    }

    .header-title {
      font-size: var(--scale-lg);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .header-action {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--paper-elevated);
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .header-action:active { transform: scale(0.95); background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    .app-main {
      flex: 1;
      overflow-y: auto;
      padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + var(--space-4));
      padding-inline: var(--space-4);
      padding-top: var(--space-4);
    }

    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      height: calc(var(--tab-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(248,250,252,0.95);
      backdrop-filter: saturate(180%) blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding-inline: var(--safe-left) var(--safe-right);
    }

    @media (prefers-color-scheme: dark) {
      .tab-bar { background: rgba(15,23,42,0.95); }
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: var(--space-2) var(--space-1) var(--space-3);
      background: none;
      border: none;
      color: var(--ink-subtle);
      cursor: pointer;
      transition: color 0.15s ease;
      min-height: var(--tab-h);
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn:active { color: var(--accent); }
    .tab-btn.active { color: var(--accent); }
    .tab-btn svg { width: 24px; height: 24px; stroke-width: 2.2; }
    .tab-btn span { font-size: var(--scale-xs); font-weight: 600; letter-spacing: 0.01em; }

    .tab-indicator {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 0px);
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1), width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== SCREENS ===== */
    .screen {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ===== COMPONENTS ===== */
    .card {
      background: var(--paper-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-header {
      padding: var(--space-5) var(--space-5) var(--space-3);
      border-bottom: 1px solid var(--border);
    }
    .card-title { font-size: var(--scale-xl); font-weight: 700; letter-spacing: -0.02em; margin: 0; }
    .card-subtitle { font-size: var(--scale-sm); color: var(--ink-muted); margin: var(--space-1) 0 0; }

    .card-body { padding: var(--space-5); }

    .section { margin-bottom: var(--space-6); }
    .section:last-child { margin-bottom: 0; }
    .section-title { font-size: var(--scale-sm); font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 var(--space-3); }

    .field { margin-bottom: var(--space-4); }
    .field-label { display: block; font-size: var(--scale-sm); font-weight: 600; color: var(--ink); margin-bottom: var(--space-2); }
    .field-hint { font-size: var(--scale-xs); color: var(--ink-subtle); margin-top: var(--space-1); }

    .input, .select {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      font-size: var(--scale-base);
      font-family: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .input:focus, .select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: var(--paper-elevated);
    }
    .input::placeholder { color: var(--ink-subtle); }
    .input.error, .select.error { border-color: var(--danger); }
    .input.error:focus, .select.error:focus { box-shadow: 0 0 0 3px var(--danger-soft); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      width: 100%;
      padding: var(--space-3) var(--space-5);
      font-size: var(--scale-base);
      font-weight: 600;
      font-family: inherit;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:not(:disabled):active { background: var(--accent-strong); }
    .btn-secondary { background: var(--border); color: var(--ink); }
    .btn-secondary:not(:disabled):active { background: var(--border-strong); }
    .btn-ghost { background: transparent; color: var(--ink-muted); }
    .btn-ghost:not(:disabled):active { background: var(--accent-soft); color: var(--accent); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-danger:not(:disabled):active { background: var(--danger); color: white; }

    .btn-icon { width: 20px; height: 20px; flex-shrink: 0; }

    /* Image picker */
    .image-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: var(--space-3);
    }
    .image-slot {
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      border: 2px dashed var(--border);
      background: var(--paper);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .image-slot:active { border-color: var(--accent); background: var(--accent-soft); }
    .image-slot.has-image { border-style: solid; border-color: var(--border); }
    .image-slot input { display: none; }
    .image-slot svg { width: 28px; height: 28px; color: var(--ink-subtle); stroke-width: 1.8; }
    .image-slot.has-image svg { display: none; }
    .image-slot span { font-size: var(--scale-xs); color: var(--ink-subtle); font-weight: 500; }
    .image-slot.has-image span { display: none; }
    .image-slot img { width: 100%; height: 100%; object-fit: cover; }
    .image-slot .file-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 4px;
      padding: 8px;
      background: var(--accent-soft);
    }
    .image-slot .file-preview svg { width: 32px; height: 32px; color: var(--accent); display: block; }
    .image-slot .file-preview .file-name {
      font-size: 10px;
      color: var(--ink-muted);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
      font-weight: 500;
    }
    .image-slot.has-file { border-style: solid; border-color: var(--border); }
    .image-slot.has-file > span,
    .image-slot.has-file > svg:not(.file-preview svg) { display: none; }
    .image-slot .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: rgba(15,20,25,0.6);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .image-slot:hover .remove-btn, .image-slot:focus-within .remove-btn { opacity: 1; }
    .image-slot .remove-btn:active { background: var(--danger); transform: scale(0.9); }
    .image-slot .remove-btn svg { width: 14px; height: 14px; }

    .add-slot { border-style: dashed; }
    .add-slot:active { border-color: var(--accent); background: var(--accent-soft); }

    /* Gallery preview */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: var(--space-2);
    }
    .gallery-item {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-1) var(--space-3);
      font-size: var(--scale-xs);
      font-weight: 600;
      border-radius: var(--radius-full);
    }
    .status-badge.success { background: var(--success-soft); color: var(--success); }
    .status-badge.warning { background: var(--warning-soft); color: var(--warning); }
    .status-badge.error { background: var(--danger-soft); color: var(--danger); }
    .status-badge.info { background: var(--accent-soft); color: var(--accent); }
    .status-badge svg { width: 12px; height: 12px; }

    /* Quiz card */
    .quiz-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
    }
    .quiz-question {
      font-size: var(--scale-lg);
      font-weight: 700;
      line-height: 1.35;
      margin: 0 0 var(--space-4);
      color: var(--ink);
    }
    .quiz-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--border);
    }
    .quiz-progress { font-size: var(--scale-sm); color: var(--ink-muted); font-weight: 500; }
    .quiz-progress strong { color: var(--ink); }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-2);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--paper-elevated);
      color: var(--ink);
      font-size: var(--scale-base);
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .option-btn:last-child { margin-bottom: 0; }
    .option-btn:active { transform: scale(0.99); }
    .option-btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .option-btn.correct { background: var(--success-soft); border-color: var(--success); color: var(--success); }
    .option-btn.incorrect { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .option-btn.disabled { opacity: 0.6; cursor: not-allowed; }
    .option-btn .option-letter {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--scale-sm);
      flex-shrink: 0;
    }
    .option-btn.correct .option-letter { background: var(--success); color: white; }
    .option-btn.incorrect .option-letter { background: var(--danger); color: white; }

    .explanation {
      margin-top: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--accent-soft);
      border-radius: var(--radius-md);
      font-size: var(--scale-sm);
      line-height: 1.6;
      color: var(--ink);
      border-left: 3px solid var(--accent);
    }
    .explanation strong { color: var(--accent-strong); }

    /* History */
    .history-list { display: flex; flex-direction: column; gap: var(--space-2); }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: all 0.15s ease;
    }
    .history-item:active { background: var(--accent-soft); }
    .history-info { display: flex; flex-direction: column; gap: 2px; }
    .history-age { font-weight: 600; font-size: var(--scale-base); color: var(--ink); }
    .history-meta { font-size: var(--scale-xs); color: var(--ink-subtle); }
    .history-score {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .history-value { font-size: var(--scale-lg); font-weight: 700; color: var(--accent); }
    .history-pct { font-size: var(--scale-xs); font-weight: 600; color: var(--ink-muted); }

    .empty-state {
      text-align: center;
      padding: var(--space-10) var(--space-4);
      color: var(--ink-muted);
    }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: var(--space-3); opacity: 0.5; }
    .empty-state p { margin: 0; font-size: var(--scale-base); }
    .empty-state .hint { font-size: var(--scale-sm); margin-top: var(--space-1); opacity: 0.7; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(15,20,25,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .loading-overlay.visible { opacity: 1; visibility: visible; }
    .loading-card {
      background: var(--paper-elevated);
      border-radius: var(--radius-lg);
      padding: var(--space-8) var(--space-6);
      text-align: center;
      max-width: 280px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto var(--space-4);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: var(--scale-base); font-weight: 500; color: var(--ink); margin: 0 0 var(--space-1); }
    .loading-subtext { font-size: var(--scale-sm); color: var(--ink-muted); margin: 0; }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: calc(var(--tab-h) + var(--safe-bottom) + var(--space-4));
      left: var(--space-4);
      right: var(--space-4);
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--paper-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast.info { border-left: 3px solid var(--accent); }
    .toast svg { width: 20px; height: 20px; flex-shrink: 0;
